        }

        h1 {

        }

            gap: 40px;
            align-items: center;
        }

        .image-item {
            width: 100%;
            max-width: 500px; 
            display: flex;
            flex-direction: column;
            gap: 10px; 
        }

        .image-item p {
            margin: 0;
            text-align: left;
            font-weight: 600;
            font-size: 16px;
            color: #37352f;
        }

        .image-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
            border-top: 1px solid #ededed;

    </style>
